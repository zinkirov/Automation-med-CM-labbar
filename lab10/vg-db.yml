---
- name: Förbered databasen för VG-appen
  hosts: dbservers
  become: true
  vars_files:
    - vg/secrets.yml

  tasks:
    - name: Installera MariaDB
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Starta och aktivera MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true
  
    - name: Installera PyMySQL för Ansible
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    - name: Skapa databasen service_monitor
      community.mysql.mysql_db:
        name: service_monitor
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      register: db_result

    - name: Kopiera databasschemat till node2
      ansible.builtin.copy:
        src: vg/schema.sql
        dest: /tmp/service_monitor_schema.sql
        mode: '0644'
      register: schema_result

    - name: Skapa tabellerna
      community.mysql.mysql_db:
        name: service_monitor
        state: import
        target: /tmp/service_monitor_schema.sql
        login_unix_socket: /run/mysqld/mysqld.sock
      when: db_result.changed or schema_result.changed

    - name: Låt MariaDB lyssna på node2:s nätverksadress
      ansible.builtin.template:
        src: vg/templates/mariadb-network.cnf.j2
        dest: /etc/mysql/mariadb.conf.d/99-service-monitor.cnf
        mode: '0644'
      notify: Starta om MariaDB

    - name: Skapa databaskonto för appen på node1
      community.mysql.mysql_user:
        name: monitor_app
        host: "{{ hostvars[groups['webservers'][0]].ansible_default_ipv4.address }}"
        password: "{{ db_password }}"
        priv: "service_monitor.*:SELECT,INSERT,UPDATE,DELETE"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      no_log: true

  handlers:
    - name: Starta om MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
