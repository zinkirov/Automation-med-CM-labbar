<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Monitor</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { margin: 0; }
    header { background: #14253d; color: white; padding: 30px max(24px, calc((100vw - 1050px)/2)); }
    header p { color: #b9c9dc; margin-bottom: 0; }
    main { max-width: 1050px; margin: 30px auto; padding: 0 24px; }
    .card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 20px;
            box-shadow: 0 4px 18px #1720330c; }
    h1, h2 { margin-top: 0; }
    form { display: flex; gap: 12px; flex-wrap: wrap; }
    input { padding: 11px; border: 1px solid #c8d3e0; border-radius: 8px; flex: 1; min-width: 180px; }
    button { background: #2256c9; color: white; border: 0; border-radius: 8px;
             padding: 10px 14px; cursor: pointer; }
    button:hover { background: #183f9b; }
    button:disabled { opacity: .5; cursor: wait; }
    .secondary { background: #e8eef8; color: #172033; }
    .secondary:hover { background: #d6e2f3; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 10px; text-align: left; border-bottom: 1px solid #e8edf3; }
    th { color: #52647c; font-size: .85rem; }
    td a { color: #2256c9; }
    .badge { padding: 5px 9px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .up { background: #d9f5e7; color: #126338; }
    .down { background: #ffe1e1; color: #a02020; }
    .unknown { background: #edf0f4; color: #52647c; }
    #message { min-height: 1.5em; }
    @media (max-width: 600px) { header { padding: 25px 24px; } }
  </style>
</head>
<body>
  <header>
    <h1>Service Monitor</h1>
    <p>Övervaka dina tjänster och se svarstider och historik.</p>
  </header>

  <main>
    <section class="card">
      <h2>Lägg till tjänst</h2>
      <form id="service-form">
        <input name="name" placeholder="Namn, t.ex. Min webbserver" maxlength="100" required>
        <input name="url" type="url" placeholder="https://example.com" maxlength="255" required>
        <button type="submit">Lägg till</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Tjänster <span id="count"></span></h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Namn</th><th>URL</th><th>Status</th><th>Svarstid</th><th>Åtgärder</th></tr>
          </thead>
          <tbody id="services"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 id="history-title">Historik</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Tidpunkt</th><th>Status</th><th>HTTP</th><th>Svarstid</th></tr>
          </thead>
          <tbody id="history">
            <tr><td colspan="4">Välj Historik för en tjänst.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const servicesBody = document.querySelector("#services");
    const historyBody = document.querySelector("#history");
    const message = document.querySelector("#message");

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    function cell(row, value) {
      const td = document.createElement("td");
      td.textContent = value;
      row.append(td);
      return td;
    }

    function badge(value) {
      const label = document.createElement("span");
      label.className = "badge " + (value === null ? "unknown" : value ? "up" : "down");
      label.textContent = value === null ? "Ej kontrollerad" : value ? "Uppe" : "Nere";
      return label;
    }

    async function showHistory(service) {
      const checks = await api(`/api/services/${service.id}/checks`);
      document.querySelector("#history-title").textContent = `Historik: ${service.name}`;
      historyBody.replaceChildren();

      if (!checks.length) {
        const row = historyBody.insertRow();
        cell(row, "Inga kontroller ännu.");
        return;
      }

      for (const check of checks) {
        const row = historyBody.insertRow();
        cell(row, check.checked_at.replace("T", " "));
        const status = row.insertCell();
        status.append(badge(check.is_up));
        cell(row, check.status_code ?? check.error_message ?? "—");
        cell(row, `${check.response_ms} ms`);
      }
    }

    async function loadServices() {
      const services = await api("/api/services");
      document.querySelector("#count").textContent = `(${services.length})`;
      servicesBody.replaceChildren();

      if (!services.length) {
        const row = servicesBody.insertRow();
        cell(row, "Inga tjänster registrerade.");
        return;
      }

      for (const service of services) {
        const checks = await api(`/api/services/${service.id}/checks`);
        const latest = checks[0];
        const row = servicesBody.insertRow();
        cell(row, service.name);

        const urlCell = row.insertCell();
        const link = document.createElement("a");
        link.href = service.url;
        link.textContent = service.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        urlCell.append(link);

        const status = row.insertCell();
        status.append(badge(latest ? latest.is_up : null));
        cell(row, latest ? `${latest.response_ms} ms` : "—");

        const actions = row.insertCell();
        const checkButton = document.createElement("button");
        checkButton.textContent = "Kontrollera";
        checkButton.addEventListener("click", async () => {
          checkButton.disabled = true;
          try {
            await api(`/api/services/${service.id}/check`, { method: "POST" });
            await loadServices();
            await showHistory(service);
          } catch (error) {
            message.textContent = error.message;
          } finally {
            checkButton.disabled = false;
          }
        });

        const historyButton = document.createElement("button");
        historyButton.textContent = "Historik";
        historyButton.className = "secondary";
        historyButton.addEventListener("click", () =>
          showHistory(service).catch(error => message.textContent = error.message)
        );
        actions.append(checkButton, " ", historyButton);
      }
    }

    document.querySelector("#service-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form));
      try {
        await api("/api/services", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(values)
        });
        form.reset();
        message.textContent = "Tjänsten har lagts till.";
        await loadServices();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    loadServices().catch(error => message.textContent = error.message);
  </script>
</body>
</html>
