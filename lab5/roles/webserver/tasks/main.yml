---
- name: Installera Nginx
  ansible.builtin.apt:
    name: "{{ web_package }}"
    state: present

- name: Generate the web page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html

- name: Skapa Nginx-konfiguration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    validate: '/usr/sbin/nginx -t -c %s'
  notify: Restart Nginx

- name: Se till att Nginx körs och startar automatiskt
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
